<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aethera</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#04050a;
font-family:'Poppins',sans-serif;
height:100vh;
color:white;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#1f2959 0%,#090b16 45%,#030308 100%);
overflow:hidden;
}

#moon{

position:absolute;
right:10%;
top:10%;

width:170px;
height:170px;

border-radius:50%;

background:

radial-gradient(circle at 35% 35%,
#fffdf8,
#fff3d2 35%,
#ffd58e 80%);

box-shadow:

0 0 40px rgba(255,255,255,.5),

0 0 120px rgba(255,245,190,.3),

0 0 200px rgba(255,255,255,.2);

animation:

moonFloat 8s ease-in-out infinite;

}

@keyframes moonFloat{

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-15px);

}

100%{

transform:translateY(0);

}

}

.fog{

position:absolute;

width:200%;

height:250px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.04),

transparent

);

filter:blur(35px);

animation:fogMove 60s linear infinite;

}

.fog:nth-child(1){

top:20%;

}

.fog:nth-child(2){

bottom:15%;

animation-duration:80s;

opacity:.5;

}

@keyframes fogMove{

0%{

transform:translateX(-60%);

}

100%{

transform:translateX(0%);

}

}

#intro{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

text-align:center;

z-index:100;

width:90%;

max-width:900px;

}

#title{

font-family:

'Cormorant Garamond',

serif;

font-size:90px;

letter-spacing:12px;

font-weight:600;

opacity:0;

animation:

fadeTitle 3s forwards;

}

@keyframes fadeTitle{

to{

opacity:1;

}

}

#subtitle{

margin-top:18px;

font-size:18px;

opacity:.75;

line-height:1.8;

animation:

fadeTitle 4s forwards;

}

.enter{

margin-top:60px;

padding:18px 60px;

background:

rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(20px);

border-radius:100px;

color:white;

font-size:15px;

letter-spacing:6px;

cursor:pointer;

transition:.4s;

}

.enter:hover{

transform:translateY(-4px);

background:white;

color:#111;

box-shadow:

0 20px 50px rgba(255,255,255,.15);

}

#loading{

position:absolute;

top:40px;

left:50%;

transform:translateX(-50%);

letter-spacing:5px;

font-size:12px;

opacity:.5;

}

.star{

position:absolute;

background:white;

border-radius:50%;

animation:twinkle infinite alternate;

}

@keyframes twinkle{

from{

opacity:.2;

}

to{

opacity:1;

}

}
/* ===========================
WORLD
=========================== */

#world{

position:absolute;
left:50%;
bottom:5%;
transition:2s;
transform:translateX(-50%);

z-index:500;

animation:floatIsland 6s ease-in-out infinite;
pointer-events:auto;

}

@keyframes floatIsland{

0%,100%{

transform:translateX(-50%) translateY(0);

}

50%{

transform:translateX(-50%) translateY(-15px);

}

}

#island{

width:420px;
height:160px;

border-radius:50%;

background:

radial-gradient(circle,#3c5d39,#1e3520);

box-shadow:

0 40px 90px rgba(0,0,0,.55);

position:relative;

overflow:visible;

}

/* ===========================
TREE
=========================== */

#tree{

position:absolute;

left:50%;

bottom:55px;

transform:translateX(-50%);

width:22px;

height:130px;

background:#4d3217;

border-radius:20px;

}

#tree::before{

content:"";

position:absolute;

bottom:80px;

left:50%;

transform:translateX(-50%);

width:170px;

height:170px;

border-radius:50%;

background:

radial-gradient(circle,#ffd7ef,#ffb9dc,#f59acb);

box-shadow:

0 0 80px rgba(255,180,220,.4);

}

/* =======================
LAKE
======================= */

#lake{

position:absolute;

bottom:-30px;

left:50%;

transform:translateX(-50%);

width:230px;

height:70px;

border-radius:50%;

background:

radial-gradient(circle,

rgba(170,220,255,.55),

rgba(60,120,255,.18),

transparent);

filter:blur(4px);

animation:lakeGlow 4s ease-in-out infinite;

}

@keyframes lakeGlow{

0%,100%{

opacity:.5;

transform:translateX(-50%) scale(1);

}

50%{

opacity:1;

transform:translateX(-50%) scale(1.06);

}

}

/* =======================
BUTTERFLIES
======================= */

.butterfly{

position:absolute;

width:14px;

height:14px;

border-radius:50%;

background:#ffe8ff;

box-shadow:

0 0 18px rgba(255,255,255,.8);

animation:fly 9s linear infinite;

}

.butterfly:nth-child(1){

left:80px;

top:-20px;

animation-delay:0s;

}

.butterfly:nth-child(2){

left:230px;

top:10px;

animation-delay:2s;

}

.butterfly:nth-child(3){

left:180px;

top:-40px;

animation-delay:5s;

}

.butterfly:nth-child(4){

left:300px;

top:-10px;

animation-delay:7s;

}

@keyframes fly{

0%{

transform:translate(0,0);

}

25%{

transform:translate(40px,-30px);

}

50%{

transform:translate(-30px,-60px);

}

75%{

transform:translate(-60px,-10px);

}

100%{

transform:translate(0,0);

}

}
#gate::after{

content:"";

position:absolute;

inset:-12px;

border-radius:50px 50px 0 0;

border:2px solid rgba(255,255,255,.3);

animation:ring 2s infinite;

}

@keyframes ring{

0%{

transform:scale(1);

opacity:1;

}

100%{

transform:scale(1.35);

opacity:0;

}

}
#library{

position:absolute;

inset:0;

display:none;

justify-content:center;

align-items:center;

z-index:200;

}

/* =========================================
   LIBRARY
========================================= */

#library{

    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    z-index:200;

    perspective:2000px;

    background:
    rgba(0,0,0,.2);

}


/* =========================================
   BOOK
========================================= */

#book{

    position:relative;

    width:760px;
    height:480px;

    transform-style:preserve-3d;

    opacity:0;

    transform:
        scale(.8)
        translateY(40px);

}


/* =========================================
   BUKU MUNCUL
========================================= */

#book.book-visible{

    animation:
        bookAppear
        1s
        ease
        forwards;

}


@keyframes bookAppear{

    from{

        opacity:0;

        transform:
            scale(.8)
            translateY(40px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

    }

}


/* =========================================
   HALAMAN
========================================= */

.book-pages{

    position:absolute;

    inset:0;

    display:flex;

    width:100%;
    height:100%;

    opacity:0;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.6);

}


#book.pages-visible
.book-pages{

    opacity:1;

}


/* =========================================
   PAGE
========================================= */

.book-page{

    position:relative;

    width:50%;
    height:100%;

    padding:45px;

    color:#3d3429;

}


.page-left{

    background:
    linear-gradient(
        90deg,
        #d0c3b0,
        #eee5d6
    );

    border-radius:
        15px 0 0 15px;

}


.page-right{

    background:
    linear-gradient(
        90deg,
        #eee7da,
        #fffdf8
    );

    border-radius:
        0 15px 15px 0;

}


/* =========================================
   COVER
========================================= */

.book-cover{

    position:absolute;

    top:0;

    width:50%;
    height:100%;

    z-index:10;

    background:

    linear-gradient(
        135deg,
        #241711,
        #6d4935 50%,
        #2a1a15
    );

    color:#f9ead0;

    transform-style:preserve-3d;

    backface-visibility:hidden;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.6);

}


/* =========================================
   COVER KIRI
========================================= */

.cover-front{

    left:0;

    transform-origin:
        left center;

    border-radius:
        15px 0 0 15px;

}


/* =========================================
   COVER KANAN
========================================= */

.cover-back{

    right:0;

    transform-origin:
        right center;

    border-radius:
        0 15px 15px 0;

}


/* =========================================
   COVER MEMBUKA
========================================= */

#book.opening
.cover-front{

    animation:
        openLeft
        2s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        )
        forwards;

}


#book.opening
.cover-back{

    animation:
        openRight
        2s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        )
        forwards;

}


/* KIRI → KIRI */

@keyframes openLeft{

    from{

        transform:
            rotateY(0deg);

    }

    to{

        transform:
            rotateY(-180deg);

    }

}


/* KANAN → KANAN */

@keyframes openRight{

    from{

        transform:
            rotateY(0deg);

    }

    to{

        transform:
            rotateY(180deg);

    }

}


/* =========================================
   TEKS
========================================= */

.page-content{

    opacity:0;

    transform:
        translateY(25px);

}


#book.typing
.page-content{

    animation:
        textAppear
        1s
        ease
        forwards;

}


@keyframes textAppear{

    from{

        opacity:0;

        transform:
            translateY(25px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================
   COVER MENUTUP
========================================= */

#book.closing
.cover-front{

    animation:
        closeLeft
        2s
        cubic-bezier(
            .55,
            .06,
            .68,
            .19
        )
        forwards;

}


#book.closing
.cover-back{

    animation:
        closeRight
        2s
        cubic-bezier(
            .55,
            .06,
            .68,
            .19
        )
        forwards;

}


@keyframes closeLeft{

    from{

        transform:
            rotateY(-180deg);

    }

    to{

        transform:
            rotateY(0deg);

    }

}


@keyframes closeRight{

    from{

        transform:
            rotateY(180deg);

    }

    to{

        transform:
            rotateY(0deg);

    }

}


/* =========================================
   BUKU MENGHILANG
========================================= */

#book.book-disappear{

    animation:
        bookDisappear
        1s
        ease
        forwards;

}


@keyframes bookDisappear{

    from{

        opacity:1;

        transform:
            scale(1);

    }

    to{

        opacity:0;

        transform:
            scale(.8)
            translateY(40px);

    }

}


/* =========================================
   ISI
========================================= */

#letterTitle{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:48px;

    color:#3b3028;

    margin-bottom:15px;

}


#typing{

    line-height:2;

    color:#554a40;

    font-size:15px;

    white-space:pre-line;

    height:280px;

    max-height:280px;

    overflow-y:auto;

    overflow-x:hidden;

    padding-right:15px;

    scroll-behavior:smooth;

    cursor:text;

}


/* Scrollbar teks */

#typing::-webkit-scrollbar{

    width:5px;

}

#typing::-webkit-scrollbar-track{

    background:rgba(100,80,60,.08);

    border-radius:10px;

}

#typing::-webkit-scrollbar-thumb{

    background:rgba(100,80,60,.35);

    border-radius:10px;

}


.memory-quote{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:30px;

    line-height:1.5;

    font-style:italic;

    color:#645548;

}


.page-number{

    font-size:11px;

    letter-spacing:4px;

    opacity:.5;

    margin-bottom:30px;

}


.page-line{

    width:70px;

    height:1px;

    background:#9d8975;

    margin-bottom:25px;

}
#bookHint{

    position:fixed;

    bottom:40px;

    left:50%;

    transform:translateX(-50%);

    padding:12px 25px;

    border-radius:30px;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(10px);

    color:white;

    font-size:12px;

    letter-spacing:2px;

    opacity:.8;

    pointer-events:none;

}
.cover-front{
    left:0;

    transform-origin:left center;

    border-radius:15px 0 0 15px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
#themePanel{

position:fixed;

top:20px;

right:20px;

z-index:300;

}

#musicPanel{

position:fixed;

top:70px;

right:20px;

z-index:300;

}

select{

padding:10px 15px;

border-radius:30px;

border:none;

background:white;

}

#gallery{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:none;
    gap:20px;
    z-index:9000;
}

.photo{
    width:150px;
    height:190px;
    opacity:0;
    transform:translateY(80px) scale(.8) rotate(-8deg);
}

.photo.show{
    animation:photoIn .8s forwards;
}

@keyframes photoIn{

0%{
opacity:0;
transform:translateY(80px) scale(.8) rotate(-10deg);
}

100%{
opacity:1;
transform:translateY(0) scale(1) rotate(0);
}

}

.photo.hide{
    animation:photoOut .8s forwards;
}

@keyframes photoOut{

0%{
opacity:1;
}

100%{
opacity:0;
transform:scale(.8);
}

}

.photo:nth-child(even){

transform:rotate(4deg);

}

.photo:hover{

transform:scale(1.1) rotate(0);

}
#bg.galaxy{

background:
radial-gradient(circle at top,#1f2959 0%,#090b16 45%,#030308 100%);

}

#bg.ocean{

background:
linear-gradient(180deg,#74cfff,#2f87c8,#05395f);

}

#bg.sunset{

background:
linear-gradient(180deg,#ffb46b,#ff6d63,#5c2f8d);

}

#bg.sakura{

background:
linear-gradient(180deg,#fff5fa,#ffd5e8,#ffc3dd);

}
#weather{

position:fixed;

left:20px;

top:20px;

display:flex;

gap:10px;

z-index:999;

}

#weather button{

padding:10px 18px;

border:none;

border-radius:40px;

cursor:pointer;

background:white;

}
#viewer{

position:fixed;

inset:0;

background:rgba(0,0,0,.9);

display:none;

justify-content:center;

align-items:center;

z-index:9999;

}

#viewer img{

max-width:90%;

max-height:90%;

border-radius:15px;

cursor:pointer;

}
#aurora{

position:fixed;
inset:-30%;

background:
radial-gradient(circle at 20% 40%,rgba(88,255,221,.18),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(173,92,255,.18),transparent 35%),
radial-gradient(circle at 50% 80%,rgba(110,255,140,.15),transparent 35%);

filter:blur(80px);

animation:auroraMove 20s ease-in-out infinite alternate;

pointer-events:none;

}

@keyframes auroraMove{

0%{

transform:
translateX(-6%)
rotate(-3deg);

}

100%{

transform:
translateX(6%)
rotate(3deg);

}

}
#constellation{

position:fixed;
inset:0;
pointer-events:none;

}

.star-node{

position:absolute;

width:8px;
height:8px;

background:white;

border-radius:50%;

box-shadow:
0 0 15px white;

pointer-events:auto;

cursor:pointer;

transition:.3s;

}

.star-node:hover{

transform:scale(1.8);

}
#lake::after{

content:"";

position:absolute;

left:0;
right:0;
top:100%;

height:80px;

background:linear-gradient(

rgba(170,220,255,.25),

transparent

);

transform:scaleY(-1);

filter:blur(10px);

opacity:.45;

}

#bgVideo{

position:fixed;

inset:0;

width:100%;
height:100%;

object-fit:cover;

opacity:.15;

z-index:-2;
pointer-events:none;

}
:root{

--wind:0deg;

}

#tree{

transform:
translateX(-50%)
rotate(var(--wind));

transition:2.5s;

}

body.galaxy{

background:#04050a;

}

body.ocean{

background:linear-gradient(
180deg,
#0d4f8b,
#02253f
);

}

body.sunset{

background:linear-gradient(
180deg,
#ff8a5c,
#ff4d6d,
#432371
);

}

body.sakura{

background:linear-gradient(
180deg,
#ffd6e8,
#ffc4dd,
#ffeef6
);

}
#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:9998;
    transition:1s;
}

#bookHint{

    position:fixed;

    bottom:40px;

    left:50%;

    transform:translateX(-50%);

    padding:12px 25px;

    border-radius:30px;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(10px);

    color:white;

    font-size:12px;

    letter-spacing:2px;

    opacity:.8;

    pointer-events:none;

    animation:hintPulse 2s ease-in-out infinite;

}

@keyframes hintPulse{

    0%,100%{
        opacity:.5;
    }

    50%{
        opacity:1;
    }

}
/* ==============================
   TRANSISI KEMBALI KE AWAL
============================== */

#intro{
    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

/* Saat kembali ke awal, intro muncul perlahan */
#intro.returning{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* World mundur perlahan */
#world.returning{
    transition:
        transform 2.5s cubic-bezier(.22,.61,.36,1);
}
</style>

</head>

<script>

const canvas=document.getElementById("stars");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}

resize();

window.onresize=resize;

const stars=[];

for(let i=0;i<250;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

a:Math.random(),

s:Math.random()*0.02

});

}
const particles = [];

for(let i=0;i<80;i++){

    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        dx:(Math.random()-0.5)*0.4,
        dy:(Math.random()-0.5)*0.4
    });

}

function drawParticles(){

    ctx.fillStyle="rgba(255,255,255,.8)";

    particles.forEach(p=>{

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0)p.x=canvas.width;
        if(p.x>canvas.width)p.x=0;

        if(p.y<0)p.y=canvas.height;
        if(p.y>canvas.height)p.y=0;

    });

}
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

if(currentTheme=="galaxy"){

    stars.forEach(star=>{

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${star.a})`;
        ctx.fill();

        star.a+=star.s;

        if(star.a>=1||star.a<=0){

            star.s*=-1;

        }

    });

}


drawParticles();

if(mode==="snow"){

    drawSnow();

}
if(mode==="rain"){

    drawRain();

}
if(mode==="sakura"){

    drawSakura();

}
    requestAnimationFrame(draw);
}

function drawSakura(){

    sakura.forEach(f=>{

        ctx.save();

        ctx.translate(f.x,f.y);

        ctx.rotate(f.angle);

        ctx.fillStyle="#ffc6dd";

        ctx.beginPath();

        ctx.ellipse(0,0,6,4,0,0,Math.PI*2);

        ctx.fill();

        ctx.restore();

        f.y+=1.2;

        f.x+=Math.sin(f.y*.02);

        f.angle+=0.02;

        if(f.y>canvas.height){

            f.y=-20;

            f.x=Math.random()*canvas.width;

        }

    });

}

let typingTimer = null;

function typeWriter(){

    const book = document.getElementById("book");
    const area = document.getElementById("typing");

    // ==============================
    // RESET
    // ==============================

    if(typingTimer){
        clearInterval(typingTimer);
        typingTimer = null;
    }

    book.classList.remove(
        "book-visible",
        "opening",
        "pages-visible",
        "typing",
        "closing",
        "book-disappear"
    );

    area.textContent = "";

    // Reset scroll ke atas
    area.scrollTop = 0;

    // Paksa browser membaca ulang animasi
    void book.offsetWidth;


    // ==============================
    // 1. BUKU MUNCUL
    // ==============================

    book.classList.add("book-visible");


    // ==============================
    // 2. COVER MEMBUKA
    // ==============================

    setTimeout(() => {

        book.classList.add("opening");

    }, 1000);


    // ==============================
    // 3. COVER SELESAI MEMBUKA
    // 4. HALAMAN MUNCUL
    // 5. TYPING DIMULAI
    // ==============================

    setTimeout(() => {

        book.classList.add("pages-visible");

        book.classList.add("typing");


        let i = 0;


        typingTimer = setInterval(() => {


            // ==============================
            // TYPING
            // ==============================

            if(i < text.length){

                area.textContent += text.charAt(i);

                i++;


                // ==============================
                // AUTO SCROLL KE BAWAH
                // ==============================

                area.scrollTo({

                    top: area.scrollHeight,

                    behavior: "smooth"

                });


            }else{


                // ==============================
                // TYPING SELESAI
                // ==============================

                clearInterval(typingTimer);

                typingTimer = null;


                console.log(
                    "Typing selesai. Menunggu user klik."
                );


                // ==============================
                // USER HARUS KLIK 1X
                // ==============================

                book.classList.add(
                    "waiting-for-click"
                );


                // Tampilkan petunjuk
                showBookHint();


                // ==============================
                // TUNGGU USER KLIK
                // ==============================

                book.addEventListener(
                    "click",
                    handleBookClick,
                    { once:true }
                );


            }

        },35);


    },3000);

}

function handleBookClick(e){

    // Kalau klik di area teks,
    // jangan tutup buku
    if(e.target.closest("#typing")){

        return;

    }

    // Hapus petunjuk
    const hint =
        document.getElementById("bookHint");

    if(hint){
        hint.remove();
    }

    // Tutup buku
    closeBook();

}
function closeBook(){

    const book = document.getElementById("book");
    const library = document.getElementById("library");

    // ==============================
    // 1. TUTUP BUKU
    // ==============================

    book.classList.remove("opening");

    void book.offsetWidth;

    book.classList.add("closing");


    // ==============================
    // 2. TUNGGU COVER SELESAI MENUTUP
    // ==============================

    setTimeout(() => {

        // Buku mengecil dan menghilang
        book.classList.add("book-disappear");


        // ==============================
        // 3. TUNGGU BUKU HILANG
        // ==============================

        setTimeout(() => {

            // Sembunyikan library
            library.style.display = "none";


            // Reset posisi buku
            book.className = "";

            document.getElementById("typing").textContent = "";


            // ==============================
            // 4. KEMBALI KE DUNIA AETHERA
            // ==============================

            resetAethera();


        },1000);

    },2000);

}
function wait(ms){

    return new Promise(resolve=>setTimeout(resolve,ms));

}
function resetAethera(){

    // ==============================
    // RESET STATUS
    // ==============================

    entered = false;
    openedPhotos = 0;


    // ==============================
    // RESET WORLD
    // ==============================

    world.style.animation = "none";

    world.style.transition =
        "transform 2.5s cubic-bezier(.22,.61,.36,1)";

    // Mulai dari kondisi zoom besar
    world.style.transform =
        "translateX(-50%) scale(18)";


    // ==============================
    // RESET GALERI
    // ==============================

    gallery.style.display = "none";


    const photos =
        document.querySelectorAll(".photo");


    photos.forEach(photo => {

        photo.classList.remove(
            "show",
            "hide"
        );

        delete photo.dataset.opened;

    });


    // ==============================
    // INTRO MASIH TERSEMBUNYI
    // ==============================

    intro.style.opacity = "0";

    intro.style.pointerEvents = "none";


    // ==============================
    // FORCE REFLOW
    // ==============================

    void world.offsetWidth;


    // ==============================
    // KAMERA MUNDUR
    // ==============================

    requestAnimationFrame(() => {

        world.style.transform =
            "translateX(-50%) scale(1)";

    });


    // ==============================
    // INTRO MUNCUL SETELAH KAMERA
    // MULAI MUNDUR
    // ==============================

    setTimeout(() => {

        intro.style.opacity = "1";
        intro.style.pointerEvents = "auto";

    },1500);


    // ==============================
    // WORLD KEMBALI MELAYANG
    // ==============================

    setTimeout(() => {

        world.style.animation =
            "floatIsland 6s ease-in-out infinite";

    },2500);


    // ==============================
    // RESET FLASH
    // ==============================

    flash.style.opacity = "0";

}

async function enterWorld(){

    if(entered) return;
    entered = true;

    // Intro hilang
    intro.style.opacity = "0";
    intro.style.pointerEvents = "none";

    // Pulau berhenti melayang
    world.style.animation = "none";

    

    await wait(300);

    // Kamera masuk ke gate
    world.style.transition = "2.5s ease-in";
    world.style.transform = "translateX(-50%) scale(18)";

    await wait(2000);

    // Flash
    flash.style.opacity = "1";

    await wait(700);

    flash.style.opacity = "0";

    // Galeri muncul
    gallery.style.display = "flex";

    const photos = document.querySelectorAll(".photo");

    photos.forEach((photo,index)=>{

        setTimeout(()=>{
            photo.classList.add("show");
        },index*300);

    });

    // Tunggu user klik foto
 photos.forEach(photo=>{

    photo.onclick=()=>{

        if(photo.dataset.opened) return;

        photo.dataset.opened = "true";

        viewer.style.display = "flex";
        viewerImg.src = photo.src;

        openedPhotos++;

    };

});
    }

for(let i=0;i<150;i++){

}
function drawRain(){

    ctx.strokeStyle = "rgba(180,220,255,.8)";

    rainDrops.forEach(r=>{

        ctx.beginPath();

        ctx.moveTo(r.x,r.y);

        ctx.lineTo(r.x-2,r.y+12);

        ctx.stroke();

        r.y+=12;

        if(r.y>canvas.height){
            r.y=0;
            r.x=Math.random()*canvas.width;
        }

    });

}

const snow = [];

for(let i=0;i<150;i++){

    snow.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3+1
    });

}

function drawSnow(){

    ctx.fillStyle="white";

    snow.forEach(s=>{

        ctx.beginPath();

        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

        ctx.fill();

        s.y+=1;

        s.x+=Math.sin(s.y*.01);

        if(s.y>canvas.height){

            s.y=0;

            s.x=Math.random()*canvas.width;

        }

    });

}
